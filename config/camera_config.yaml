# ATCC Phase 1 — camera / pipeline configuration
# All runtime paths and thresholds live here (no hardcoded paths in code).

source:
  type: file  # Phase 1: file only. Phase 3: "rtsp"
  path: "data/sample_videos/sample1.mp4"

frame_sampling:
  # Process at ~this FPS regardless of source FPS (every Nth frame derived from source FPS).
  target_fps: 12

roi:
  # Empty polygon = full frame. Example road ROI (pixel coords of source video):
  # polygon: [[100, 200], [1800, 200], [1900, 1000], [50, 1000]]
  enabled: false
  polygon: []

preprocessing:
  # Letterbox / resize to model input size (Ultralytics handles letterbox; we pass imgsz).
  imgsz: 640
  # CLAHE lighting normalization (optional)
  clahe:
    enabled: false
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  # Optional: skip inference on near-static frames (NOT background-subtraction detection)
  motion_skip:
    enabled: false
    min_diff_ratio: 0.01

lanes:
  # Counting lines — adjust to match your video. Coordinates are in original frame pixels.
  - name: "lane_1_northbound"
    direction: "north"
    line: [[200, 400], [600, 400]]
  - name: "lane_2_southbound"
    direction: "south"
    line: [[700, 400], [1100, 400]]

detection:
  model_path: "yolov8n.pt"
  confidence_threshold: 0.4
  iou_threshold: 0.5
  device: ""  # "" = auto (CUDA if available), or "cpu" / "0"

# Single source of truth for vehicle class taxonomy (Phase 1 = COCO-mapped placeholders).
# IMPORTANT: Full India-specific 16-class taxonomy requires a custom labeled dataset
# (Phase 2). Do not treat these as production-accurate Indian vehicle classes.
classes:
  # Target display names used in Excel reports (mapped from COCO via detector.map_coco_to_target)
  target:
    - bicycle
    - motorcycle
    - car
    - bus
    - truck
  # COCO class IDs we keep from pretrained YOLOv8 (bicycle=1, car=2, motorcycle=3, bus=5, truck=7)
  coco_vehicle_ids: [1, 2, 3, 5, 7]

tracking:
  # ByteTrack defaults (supervision.ByteTrack)
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  frame_rate: 12

export:
  interval_minutes: 15
  output_dir: "outputs/reports"
  # "append" = one workbook, rows per interval; "session" = new file each run
  mode: append
  # "single" = one sheet; "per_day" = one sheet per calendar day
  sheet_strategy: single
  filename_prefix: "atcc_report"

visualization:
  # Draw boxes / lines / counts on annotated output video (optional, for debugging)
  enabled: true
  output_dir: "outputs/annotated"

logging:
  level: INFO
  per_frame_timing: true
