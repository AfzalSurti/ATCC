# ATCC camera / pipeline configuration
# All runtime paths and thresholds live here (no hardcoded paths in code).

source:
  # "file" | "rtsp" | "webcam" (webcam: set path to "0")
  type: file
  path: "data/sample_videos/sample1.mp4"
  # Live-only options (Phase 3):
  # url: "rtsp://user:pass@192.168.1.10:554/stream1"
  reconnect_seconds: 3
  read_timeout_ms: 5000
  max_reconnects: 0  # 0 = unlimited

frame_sampling:
  # Process at ~this FPS regardless of source FPS (every Nth frame derived from source FPS).
  target_fps: 12

roi:
  # Empty polygon = full frame. Example road ROI (pixel coords of source video):
  # polygon: [[100, 200], [1800, 200], [1900, 1000], [50, 1000]]
  enabled: false
  polygon: []

preprocessing:
  imgsz: 640
  clahe:
    enabled: false
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  motion_skip:
    enabled: false
    min_diff_ratio: 0.01

lanes:
  - name: "lane_1_northbound"
    direction: "north"
    line: [[200, 400], [600, 400]]
  - name: "lane_2_southbound"
    direction: "south"
    line: [[700, 400], [1100, 400]]

detection:
  # backend: ultralytics | onnx | tensorrt
  backend: ultralytics
  model_path: "yolov8n.pt"
  # onnx_path: "outputs/models/yolov8n.onnx"
  # engine_path: "outputs/models/yolov8n.engine"
  confidence_threshold: 0.4
  iou_threshold: 0.5
  device: ""  # "" = auto (CUDA if available), or "cpu" / "0"

# Single source of truth for vehicle class taxonomy.
# mode: coco_mapped  → Phase 1 pretrained COCO placeholder mapping
# mode: custom       → Phase 2 fine-tuned model; names come from target[] order
classes:
  mode: coco_mapped
  target:
    - bicycle
    - motorcycle
    - car
    - bus
    - truck
  coco_vehicle_ids: [1, 2, 3, 5, 7]
  # After Phase 2 training, switch to:
  # mode: custom
  # target:  # must match config/india_classes.yaml / data.yaml order
  #   - two_wheeler
  #   - three_wheeler_auto
  #   - ...

tracking:
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  frame_rate: 12

export:
  interval_minutes: 15
  output_dir: "outputs/reports"
  mode: append
  sheet_strategy: single
  filename_prefix: "atcc_report"

visualization:
  enabled: true
  output_dir: "outputs/annotated"
  publish_stats: true  # feed Streamlit dashboard via StatsStore

logging:
  level: INFO
  per_frame_timing: true
