# ATCC camera / pipeline configuration
# Calibrate junction arm lines to your camera pixel coordinates.

source:
  type: file
  path: "data/sample_videos/sample1.mp4"
  reconnect_seconds: 3
  read_timeout_ms: 5000
  max_reconnects: 0

frame_sampling:
  target_fps: 12

roi:
  enabled: false
  polygon: []

preprocessing:
  imgsz: 640
  clahe:
    enabled: false
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  motion_skip:
    enabled: false
    min_diff_ratio: 0.01

# ---------------------------------------------------------------------------
# Junction model
#   two_way   → 2 movements  (incoming + outgoing)
#   three_way → 6 movements  (3 arms × IN + OUT)
#   four_way  → 8 movements  (4 arms × IN + OUT)
#
# IN  = entering the junction from that arm
# OUT = leaving the junction toward that arm
# Replace placeholder line coords with your video's pixel positions.
# ---------------------------------------------------------------------------
junction:
  type: four_way
  arms:
    - name: north
      label: "North approach"
      in_line: [[420, 180], [700, 180]]
      out_line: [[420, 220], [700, 220]]
    - name: east
      label: "East approach"
      in_line: [[980, 360], [1180, 560]]
      out_line: [[940, 360], [1140, 560]]
    - name: south
      label: "South approach"
      in_line: [[420, 820], [700, 820]]
      out_line: [[420, 780], [700, 780]]
    - name: west
      label: "West approach"
      in_line: [[80, 360], [280, 560]]
      out_line: [[120, 360], [320, 560]]

# Legacy flat lanes (ignored when junction: is present). Kept as reference only.
# lanes: []

detection:
  backend: ultralytics
  model_path: "yolov8n.pt"
  confidence_threshold: 0.4
  iou_threshold: 0.5
  device: ""

# Report classes from COCO Phase-1 mapping (bicycle, motorcycle, car, bus, truck).
# Primary categories requested for ATCC reports: bicycle / car / truck
# (+ motorcycle, bus retained from the detector).
classes:
  mode: coco_mapped
  target:
    - bicycle
    - motorcycle
    - car
    - bus
    - truck
  coco_vehicle_ids: [1, 2, 3, 5, 7]

tracking:
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  frame_rate: 12

export:
  interval_minutes: 15
  output_dir: "outputs/reports"
  mode: append
  sheet_strategy: single
  filename_prefix: "atcc_report"

visualization:
  enabled: true
  output_dir: "outputs/annotated"
  publish_stats: true

logging:
  level: INFO
  per_frame_timing: true
