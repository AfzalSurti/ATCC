# Render Blueprint — ATCC API (+ video pipeline in the same service)
# Dashboard: https://dashboard.render.com → New → Blueprint → this repo

services:
  - type: web
    name: atcc-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      pip install -r requirements-render.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        sync: false
      - key: SERVE_FRONTEND
        value: "0"
